<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Flightdeck — demo reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   Flightdeck demo reel — produced motion-graphics recreation of
   the real app chrome (Deep Cove theme). Standalone, self-contained,
   autoplays on load, resolves window.REEL_DONE when finished.
   Tokens copied from src/theme.css (dark + dracula + nord subsets).
   ============================================================ */

:root{
  --abyss:#03050A; --bg:#05080E; --bg-2:#080C14; --surface:#0B0F19; --surface-2:#111827; --elevated:#171F30;
  --line:rgba(148,184,224,0.19); --line-strong:rgba(148,184,224,0.34);
  --on-accent:#05080E; --on-warn:#1a1400;
  --text:#EAF1F8; --muted:#94A6BC; --faint:#71839A;
  --ice:#9AE9FF; --azure:#43A6F5; --aqua:#57E5C6; --deepblue:#3F6BFF; --red:#FF5C6A; --accent:#43A6F5;
  --st-starting:#43A6F5; --st-running:#52E08A; --st-waiting:#F2B03D; --st-idle:#71839A; --st-error:#FF5C6A; --st-exited:#57E5C6;
  --accent-grad:linear-gradient(125deg,#9AE9FF 0%,#43A6F5 48%,#3F6BFF 100%);
  --glow:0 0 0 1px rgba(67,166,245,0.20), 0 8px 40px rgba(67,166,245,0.22);
  --shadow-lg:0 30px 70px -20px rgba(0,0,0,0.75);
  --font-sans:"Schibsted Grotesk","Segoe UI Variable","Segoe UI",system-ui,sans-serif;
  --font-mono:"JetBrains Mono","Cascadia Code",Consolas,ui-monospace,monospace;
  --ease-out:cubic-bezier(0.16,1,0.3,1);
}
html[data-theme="dracula"]{
  --abyss:#191A21; --bg:#282A36; --bg-2:#21222C; --surface:#343746; --surface-2:#3A3D4D; --elevated:#44475A;
  --line:rgba(189,147,249,0.14); --line-strong:rgba(189,147,249,0.28);
  --text:#F8F8F2; --muted:#B6B8C9; --faint:#7B87B0;
  --ice:#8BE9FD; --azure:#62D6F5; --aqua:#69FFC4; --deepblue:#6272A4; --red:#FF5555; --accent:#BD93F9;
  --st-starting:#8BE9FD; --st-running:#50FA7B; --st-waiting:#F1FA8C; --st-idle:#6272A4; --st-error:#FF5555; --st-exited:#69FFC4;
  --accent-grad:linear-gradient(125deg,#8BE9FD 0%,#BD93F9 48%,#FF79C6 100%);
  --shadow-lg:0 30px 70px -20px rgba(0,0,0,0.80);
}
html[data-theme="nord"]{
  --abyss:#242933; --bg:#2E3440; --bg-2:#292E39; --surface:#3B4252; --surface-2:#434C5E; --elevated:#4C566A;
  --line:rgba(216,222,233,0.12); --line-strong:rgba(216,222,233,0.24);
  --text:#ECEFF4; --muted:#D8DEE9; --faint:#9AA6BF;
  --ice:#88C0D0; --azure:#81A1C1; --aqua:#8FBCBB; --deepblue:#5E81AC; --red:#BF616A; --accent:#81A1C1;
  --st-starting:#88C0D0; --st-running:#A3BE8C; --st-waiting:#EBCB8B; --st-idle:#7C8AA6; --st-error:#BF616A; --st-exited:#8FBCBB;
  --accent-grad:linear-gradient(125deg,#88C0D0 0%,#81A1C1 48%,#5E81AC 100%);
  --shadow-lg:0 30px 70px -20px rgba(0,0,0,0.75);
}

*{ box-sizing:border-box; }
html,body{ margin:0; width:1280px; height:720px; overflow:hidden; background:var(--abyss); }
body{ font-family:var(--font-sans); color:var(--text); -webkit-font-smoothing:antialiased; }

#stage{ position:relative; width:1280px; height:720px; overflow:hidden; background:var(--bg); }

.scene{
  position:absolute; inset:0; display:flex; flex-direction:column;
  opacity:0; z-index:1; transition:opacity .7s var(--ease-out), background-color .6s ease, color .6s ease;
  background:var(--bg); color:var(--text);
}
.scene.active{ opacity:1; z-index:10; }
.scene-open, .scene-close{
  background:radial-gradient(120% 140% at 50% -20%, #0c1526 0%, var(--abyss) 65%);
  align-items:center; justify-content:center;
}

/* ---------- caption kicker (every scene) ---------- */
.kicker{
  position:absolute; left:40px; bottom:36px; z-index:15;
  display:inline-flex; align-items:center; gap:10px;
  padding:11px 18px; border-radius:999px;
  background:color-mix(in srgb, var(--surface) 82%, transparent);
  border:1px solid var(--line-strong); box-shadow:var(--shadow-lg);
  opacity:0; transform:translateY(10px);
  transition:opacity .5s var(--ease-out), transform .5s var(--ease-out), background-color .5s ease, border-color .5s ease;
}
.kicker.show{ opacity:1; transform:none; }
.kicker .k-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent-grad); flex:none; }
.kicker .k-text{ font-family:var(--font-sans); font-weight:700; font-size:16px; letter-spacing:-0.01em; color:var(--text); white-space:nowrap; }

.theme-tag{
  position:absolute; right:40px; top:56px; z-index:15;
  font-family:var(--font-sans); font-weight:700; font-size:12.5px; letter-spacing:.08em; text-transform:uppercase;
  color:var(--muted); padding:6px 12px; border-radius:999px; border:1px solid var(--line-strong);
  background:color-mix(in srgb, var(--surface) 78%, transparent);
  opacity:0; transition:opacity .4s ease, color .5s ease, border-color .5s ease, background-color .5s ease;
}
.theme-tag.show{ opacity:1; }

/* ============================================================
   Scene A / G — cold open + close
   ============================================================ */
.open-wrap, .close-wrap{ display:flex; flex-direction:column; align-items:center; gap:18px; text-align:center; }
.open-mark, .close-mark{
  opacity:0; transform:translateY(14px) scale(.82);
  transition:opacity .9s var(--ease-out), transform .9s var(--ease-out);
  filter:drop-shadow(0 18px 40px rgba(67,166,245,.35));
}
.open-mark.show, .close-mark.show{ opacity:1; transform:none; }
.open-word, .close-word{
  font-family:var(--font-sans); font-weight:700; font-size:44px; letter-spacing:-0.02em; color:var(--text);
  opacity:0; transform:translateY(10px);
  transition:opacity .7s var(--ease-out), transform .7s var(--ease-out);
}
.open-word.show, .close-word.show{ opacity:1; transform:none; }
.open-tag{
  font-family:var(--font-sans); font-weight:500; font-size:18px; color:var(--muted); letter-spacing:-0.005em;
  opacity:0; transform:translateY(8px);
  transition:opacity .7s var(--ease-out), transform .7s var(--ease-out);
}
.open-tag.show{ opacity:1; transform:none; }
.close-sub{
  font-family:var(--font-sans); font-weight:500; font-size:16px; color:var(--muted);
  opacity:0; transition:opacity .7s var(--ease-out);
}
.close-sub.show{ opacity:1; }
.close-sub b{ color:var(--ice); font-weight:600; }

/* ============================================================
   Shared app chrome (topbar + left rail) — reused by cockpit,
   kanban, palette and notifications scenes.
   ============================================================ */
.c-topbar{
  height:40px; flex:none; display:flex; align-items:center; gap:10px; padding:0 12px;
  border-bottom:1px solid var(--line); background:var(--bg);
  transition:background-color .5s ease, border-color .5s ease;
}
.tb-ico{ display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; color:var(--faint); }
.brand-mark{ display:inline-flex; color:var(--accent); margin-left:2px; }
.tb-brand{ font-weight:700; font-size:14.5px; letter-spacing:-0.01em; }
.tb-ws{ color:var(--muted); font-size:13.5px; }
.tb-sp{ flex:1; }
.bell-wrap{ position:relative; }
.bell{ position:relative; display:inline-flex; align-items:center; justify-content:center; color:var(--faint); padding:4px 6px; border-radius:7px; }
.bell.on{ color:var(--accent); }
.bell-badge{ position:absolute; top:-1px; right:-1px; min-width:15px; height:15px; border-radius:999px; background:var(--st-waiting); color:var(--on-warn); font-size:9px; font-weight:800; display:none; align-items:center; justify-content:center; padding:0 3px; }
.bell-badge.show{ display:flex; }

.c-body{ flex:1; min-height:0; display:flex; }
.c-rail{ width:222px; flex:none; background:var(--surface); border-right:1px solid var(--line); padding:16px 12px 12px; display:flex; flex-direction:column; gap:4px; transition:background-color .5s ease, border-color .5s ease; }
.rail-head{ font-size:10.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); padding:0 6px 8px; }
.rail-ws{ position:relative; display:flex; align-items:center; gap:10px; padding:8px 8px; border-radius:10px; transition:background-color .3s ease, box-shadow .3s ease; }
.rail-ws.active{ background:color-mix(in srgb, var(--accent) 16%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 38%, transparent); }
.rail-ws.active::before{ content:""; position:absolute; left:-12px; top:5px; bottom:5px; width:3px; border-radius:2px; background:var(--accent); box-shadow:0 0 10px var(--accent); }
.rail-i{ width:28px; height:28px; border-radius:8px; background:var(--elevated); color:var(--muted); font-size:11px; font-weight:700; display:grid; place-items:center; flex:none; transition:background-color .3s ease, color .3s ease; }
.rail-ws.active .rail-i{ color:var(--accent); background:color-mix(in srgb, var(--accent) 22%, var(--elevated)); }
.rail-meta{ display:flex; flex-direction:column; gap:2px; min-width:0; }
.rail-name{ font-size:13.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rail-stat{ display:inline-flex; align-items:center; gap:5px; font-size:10.5px; color:var(--faint); }
.rail-stat i{ width:6px; height:6px; border-radius:50%; background:var(--st-idle); }
.rail-stat.run i{ background:var(--st-running); }
.rail-stat.wait i{ background:var(--st-waiting); }
.rail-sep{ height:1px; background:var(--line); margin:8px 6px; }
.rail-app{ position:relative; display:flex; align-items:center; gap:10px; padding:7px 8px; border-radius:9px; }
.rail-app.active{ background:color-mix(in srgb, var(--accent) 16%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 38%, transparent); }
.rail-i.board{ color:var(--accent); background:transparent; }

.c-main{ flex:1; min-width:0; min-height:0; position:relative; }

/* ============================================================
   Pane grid (scene B: cockpit, + static reuse in D/E/F)
   ============================================================ */
.b-grid{ position:absolute; inset:0; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr; gap:1px; background:var(--line); transition:background-color .5s ease; }
.pane{ position:relative; display:flex; flex-direction:column; min-height:0; background:var(--surface); overflow:hidden; transition:background-color .5s ease; }
.pband{ height:3px; width:100%; flex:none; background:var(--st-idle); transition:background-color .3s ease; }
.pband.starting{ background:var(--st-starting); animation:band-breathe 1.8s ease-in-out infinite; }
.pband.running{ background:var(--st-running); }
.pband.waiting{ background:var(--st-waiting); animation:band-breathe 2.2s ease-in-out infinite; }
.pband.error{ background:var(--st-error); }
@keyframes band-breathe{ 0%,100%{ opacity:1; } 50%{ opacity:.42; } }

.phead{ display:flex; align-items:center; gap:8px; padding:7px 12px; background:var(--surface-2); border-bottom:1px solid var(--line); font-size:12px; flex:none; transition:background-color .5s ease, border-color .5s ease; }
.pdot{ width:8px; height:8px; border-radius:50%; flex:none; background:var(--st-idle); }
.pdot.starting{ background:var(--st-starting); animation:hud-pulse 1.8s ease-in-out infinite; }
.pdot.running{ background:var(--st-running); }
.pdot.waiting{ background:var(--st-waiting); animation:hud-pulse 1.8s ease-in-out infinite; }
@keyframes hud-pulse{ 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.5; transform:scale(1.25); } }
.pname{ color:var(--text); font-weight:600; }
.prepo{ color:var(--faint); }
.branch{ display:inline-flex; align-items:center; gap:4px; margin-left:4px; padding:1px 8px 1px 6px; border:1px solid var(--line-strong); border-radius:999px; font-size:10.5px; color:var(--muted); }
.branch svg{ flex:none; }

.term{ font-family:var(--font-mono); font-size:12px; line-height:1.62; padding:10px 13px; height:100%; overflow:hidden; }
.tl{ white-space:pre-wrap; word-break:break-word; }
.tl.in{ animation:tl-in .22s var(--ease-out); }
@keyframes tl-in{ from{ opacity:0; transform:translateY(3px); } to{ opacity:1; transform:none; } }
.tl-cmd{ color:var(--ice); }
.tl-out{ color:var(--text); }
.tl-faint{ color:var(--faint); }
.tl-add{ color:var(--st-running); }
.tl-rm{ color:var(--st-error); }
.tl-ok{ color:var(--st-running); }
.tcursor{ display:inline-block; width:7px; height:13px; background:var(--ice); margin-left:1px; vertical-align:-2px; animation:blink 1s steps(1) infinite; }
@keyframes blink{ 50%{ opacity:0; } }

/* ============================================================
   Scene C — Kanban
   ============================================================ */
.k-wrap{ flex:1; min-height:0; display:flex; flex-direction:column; padding:20px 26px; gap:14px; }
.k-head{ display:flex; flex-direction:column; gap:3px; }
.k-title{ font-size:19px; font-weight:700; letter-spacing:-0.01em; }
.k-sub{ font-size:13px; color:var(--muted); }
.k-cols{ flex:1; display:flex; gap:14px; min-height:0; }
.k-col{ position:relative; flex:1; min-width:0; display:flex; flex-direction:column; background:var(--surface); border:1px solid var(--line); border-radius:11px; overflow:hidden; transition:border-color .2s ease, background-color .2s ease, box-shadow .2s ease; }
.k-col.drop-active{ border-color:var(--accent); background-color:color-mix(in srgb, var(--accent) 6%, var(--surface)); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 25%, transparent); }
.k-accent{ height:3px; width:100%; flex:none; }
.k-colhead{ display:flex; align-items:center; gap:8px; padding:11px 13px; border-bottom:1px solid var(--line); }
.k-coldot{ width:7px; height:7px; border-radius:50%; }
.k-colname{ font-size:12.5px; font-weight:600; letter-spacing:.03em; }
.k-colcount{ margin-left:auto; min-width:18px; height:18px; padding:0 5px; border-radius:999px; background:var(--elevated); border:1px solid var(--line); color:var(--muted); font-size:10.5px; font-weight:600; display:inline-flex; align-items:center; justify-content:center; }
.k-list{ flex:1; overflow:hidden; padding:11px; display:flex; flex-direction:column; gap:10px; }

.k-card{ position:relative; background:var(--elevated); border:1px solid var(--line-strong); border-radius:10px; padding:13px 14px; display:flex; flex-direction:column; gap:9px; box-shadow:0 8px 18px -10px rgba(0,0,0,.5); }
.k-card-title{ font-size:13px; line-height:1.45; color:var(--text); }
.k-chips{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; }
.k-chip{ display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700; letter-spacing:.04em; padding:3px 9px; border-radius:6px; }
.k-chip-prio{ border:1px solid var(--st-waiting); color:var(--st-waiting); }
.k-chip-prio.hi{ border-color:var(--red); color:var(--red); }
.k-chip-agent{ background:var(--surface); border:1px solid var(--line); color:var(--muted); text-transform:none; font-weight:600; opacity:0; transform:scale(.85); transition:opacity .3s var(--ease-out), transform .3s var(--ease-out); }
.k-chip-agent.show{ opacity:1; transform:none; }
.k-chip-dot{ width:6px; height:6px; border-radius:50%; }
.k-chip-dot.run{ background:var(--st-running); animation:dot-pulse 1.7s ease-in-out infinite; }
@keyframes dot-pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
.k-check{ display:inline-flex; align-items:center; gap:5px; color:var(--aqua); font-size:11px; font-weight:600; }

.k-ghost{ position:absolute; z-index:30; cursor:grabbing; transform:rotate(-1.2deg); box-shadow:0 24px 50px -14px rgba(0,0,0,.65); }
.k-dropslot{ display:none; align-items:center; justify-content:center; min-height:56px; border:1.5px dashed color-mix(in srgb, var(--accent) 60%, transparent); background:color-mix(in srgb, var(--accent) 9%, transparent); border-radius:10px; font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
.k-dropslot.show{ display:flex; }

/* ============================================================
   Scene D — command palette
   ============================================================ */
.cmdp-scrim{ position:absolute; inset:0; z-index:40; background:rgba(2,4,8,.6); backdrop-filter:blur(2px); display:flex; align-items:flex-start; justify-content:center; padding-top:120px; opacity:0; transition:opacity .35s var(--ease-out); }
.cmdp-scrim.show{ opacity:1; }
.cmdp-modal{ width:520px; max-width:calc(100% - 60px); background:var(--elevated); border:1px solid var(--line-strong); border-radius:14px; box-shadow:var(--shadow-lg); overflow:hidden; transform:translateY(-10px) scale(.98); opacity:0; transition:transform .35s var(--ease-out), opacity .35s var(--ease-out); }
.cmdp-scrim.show .cmdp-modal{ transform:none; opacity:1; }
.cmdp-inputrow{ display:flex; align-items:center; gap:8px; padding:14px 16px; border-bottom:1px solid var(--line); }
.cmdp-input{ flex:1; font:inherit; font-size:14px; color:var(--text); background:transparent; }
.cmdp-input::after{ content:""; }
.cmdp-caret{ display:inline-block; width:1.5px; height:16px; background:var(--ice); margin-left:1px; vertical-align:-3px; animation:blink 1s steps(1) infinite; }
.cmdp-list{ max-height:260px; overflow:hidden; padding:6px; }
.cmdp-section{ padding:8px 10px 4px; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); }
.cmdp-item{ display:flex; align-items:center; gap:10px; padding:9px 10px; border-radius:8px; font-size:13px; color:var(--text); }
.cmdp-item.active{ background:color-mix(in srgb, var(--accent) 14%, transparent); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); }
.cmdp-ic{ display:inline-flex; color:var(--faint); flex:none; }
.cmdp-hint{ margin-left:auto; font-size:11px; color:var(--faint); font-family:var(--font-mono); }
.cmdp-foot{ display:flex; align-items:center; gap:14px; padding:10px 16px; border-top:1px solid var(--line); font-size:11px; color:var(--faint); }
.cmdp-foot kbd{ background:var(--surface-2); border:1px solid var(--line); border-radius:4px; padding:1px 5px; font-family:var(--font-mono); font-size:10.5px; color:var(--muted); }

/* ============================================================
   Scene F — notifications
   ============================================================ */
.bell-menu{ position:absolute; top:44px; right:14px; width:280px; background:var(--elevated); border:1px solid var(--line-strong); border-radius:12px; box-shadow:var(--shadow-lg); z-index:40; overflow:hidden; opacity:0; transform:translateY(-8px); transition:opacity .3s var(--ease-out), transform .3s var(--ease-out); }
.bell-menu.show{ opacity:1; transform:none; }
.bell-h{ padding:11px 14px; font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); border-bottom:1px solid var(--line); }
.bell-item{ display:flex; align-items:center; gap:10px; padding:10px 14px; transition:background-color .2s ease; }
.bell-item.flash{ background:color-mix(in srgb, var(--accent) 16%, transparent); }
.bi-dot{ width:7px; height:7px; border-radius:50%; background:var(--st-waiting); flex:none; animation:dot-pulse 1.7s ease-in-out infinite; }
.bi-ws{ font-size:12.5px; color:var(--text); }
.bi-ag{ margin-left:auto; font-size:11px; color:var(--faint); }

/* dim static backdrop used behind palette / notification overlays */
.dim{ filter:brightness(.55) saturate(.8); }
</style>
</head>
<body>
<div id="stage">

  <!-- A — cold open -->
  <div class="scene scene-open" id="scene-open">
    <div class="open-wrap">
      <svg class="open-mark" width="92" height="92" viewBox="0 0 128 128" fill="none">
        <defs><linearGradient id="og" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
          <stop stop-color="#9AE9FF"/><stop offset="0.48" stop-color="#43A6F5"/><stop offset="1" stop-color="#3F6BFF"/>
        </linearGradient></defs>
        <path d="M64 28 L99 96 L64 79 L29 96 Z" fill="url(#og)"/>
      </svg>
      <div class="open-word">Flightdeck</div>
      <div class="open-tag">Run a fleet of AI coding agents. At once.</div>
    </div>
  </div>

  <!-- B — cockpit -->
  <div class="scene scene-cockpit" id="scene-cockpit">
    <div id="shell-b"></div>
    <div class="kicker" id="kicker-b"><span class="k-dot"></span><span class="k-text"></span></div>
  </div>

  <!-- C — kanban dispatch -->
  <div class="scene scene-kanban" id="scene-kanban">
    <div class="k-wrap">
      <div class="k-head">
        <div class="k-title">Board</div>
        <div class="k-sub">drag a card to In Progress and an agent picks it up</div>
      </div>
      <div class="k-cols" id="k-cols"></div>
    </div>
    <div class="kicker" id="kicker-c"><span class="k-dot"></span><span class="k-text"></span></div>
  </div>

  <!-- D — command palette -->
  <div class="scene scene-palette" id="scene-palette">
    <div id="shell-d"></div>
    <div class="kicker" id="kicker-d"><span class="k-dot"></span><span class="k-text"></span></div>
  </div>

  <!-- E — theme montage -->
  <div class="scene scene-theme" id="scene-theme">
    <div id="shell-e"></div>
    <div class="theme-tag" id="theme-tag">Deep Cove</div>

/* ---------- typing / streaming engine ---------- */
async function typeLine(containerEl, text, cls, cps) {
  cps = cps || 46;
  const line = document.createElement('div');
  line.className = 'tl ' + cls;
  containerEl.appendChild(line);
  const cursor = document.createElement('span');
  cursor.className = 'tcursor';
  for (let i = 0; i < text.length; i++) {
    line.textContent = text.slice(0, i + 1);
    line.appendChild(cursor);
    await sleep(1000 / cps);
  }
  cursor.remove();
}

async function streamLine(containerEl, text, cls, delay) {
  await sleep(delay == null ? 80 : delay);
  const line = document.createElement('div');
  line.className = 'tl in ' + cls;
  line.textContent = text;
  containerEl.appendChild(line);
}

async function runScript(termEl, script) {
  for (const step of script) {
    if (step.type === 'input') await typeLine(termEl, step.text, 'tl-cmd', step.cps || 46);
    else await streamLine(termEl, step.text, step.cls, step.delay);
  }
}

}

  byId('e-p4-term').innerHTML = '<div class="tl tl-cmd">$ claude</div><div class="tl tl-faint">Waiting on your reply…</div>';

  await crossTo(byId('scene-theme'));

  const kicker = byId('kicker-e');
  const tag = byId('theme-tag');
  await sleep(300);
  kicker.classList.add('show');
  tag.classList.add('show');

  const themes = [
    { id: '', label: 'Deep Cove' },
    { id: 'dracula', label: 'Dracula' },
    { id: 'nord', label: 'Nord' },
    { id: '', label: 'Deep Cove' },
  ];
  for (const t of themes) {
    tag.textContent = t.label;
    if (t.id) document.documentElement.setAttribute('data-theme', t.id);
    else document.documentElement.removeAttribute('data-theme');
    await sleep(1450);
  }
  await sleep(300);
}

/* ============================================================
   Scene F — notifications
   ============================================================ */
async function sceneNotify() {
  byId('shell-f').innerHTML = shellHtml({ activeWs: 'flightdeck', wsLabel: 'flightdeck', bellId: 'bell-f', badge: '3' });
  const main = byId('c-main-slot');
  main.id = 'c-main-f';
  main.className = 'c-main dim';
  main.appendChild(staticPaneGrid('f-p'));
  byId('f-p1-term').innerHTML = '<div class="tl tl-cmd">$ claude</div><div class="tl tl-ok">✓ Committed as 4a1f0c2</div>';
  byId('f-p2-term').innerHTML = '<div class="tl tl-cmd">$ agy</div><div class="tl tl-ok">36 passed in 4.87s</div>';
  byId('f-p3-term').innerHTML = '<div class="tl tl-cmd">PS&gt; git commit</div><div class="tl tl-faint">1 file changed</div>';
  byId('f-p4-term').innerHTML = '<div class="tl tl-cmd">$ claude</div><div class="tl tl-faint">Waiting on your reply…</div>';
  byId('bell-f').classList.add('on');

  const menuHtml =
    '<div class="bell-menu" id="bell-menu">' +
      '<div class="bell-h">Waiting on you</div>' +
      '<div class="bell-item" id="bi-1"><span class="bi-dot"></span><span class="bi-ws">flightdeck — auth-middleware</span><span class="bi-ag">claude</span></div>' +
      '<div class="bell-item" id="bi-2"><span class="bi-dot"></span><span class="bi-ws">billing-service — rate-limit</span><span class="bi-ag">claude</span></div>' +
      '<div class="bell-item" id="bi-3"><span class="bi-dot"></span><span class="bi-ws">docs-site — build check</span><span class="bi-ag">pwsh</span></div>' +
    '</div>';
  byId('scene-notify').insertAdjacentHTML('beforeend', menuHtml);

  await crossTo(byId('scene-notify'));

  const kicker = byId('kicker-f');
  const kText = $('#kicker-f .k-text');
  await sleep(500);
  kText.textContent = 'Never miss what needs you.';
  kicker.classList.add('show');

  await sleep(900);
  byId('bell-menu').classList.add('show');

  await sleep(1200);
  byId('bi-1').classList.add('flash');
  await sleep(650);
  byId('bell-menu').classList.remove('show');

  await sleep(2000);
}

/* ============================================================
   Scene G — close
   ============================================================ */
async function sceneClose() {
  await crossTo(byId('scene-close'));
  await sleep(200);
  $('#scene-close .close-mark').classList.add('show');
  await sleep(600);
  $('#scene-close .close-word').classList.add('show');
  await sleep(500);
  $('#scene-close .close-sub').classList.add('show');
  await sleep(3800);
}

/* ---------- master run ---------- */
async function run() {
  await sceneOpen();
  await sceneCockpit();
  await sceneKanban();
  await scenePalette();
  await sceneTheme();
  await sceneNotify();
  await sceneClose();
}

run()
  .catch((err) => { console.error('REEL ERROR', err); })
  .finally(() => { window.__reelResolve(); });
</script>
