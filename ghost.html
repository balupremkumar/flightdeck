<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flightdeck drag</title>
    <style>
      html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; cursor: default; }
      body { font: 13px/1.3 "Segoe UI", system-ui, sans-serif; color: #e6edf7; }
      #ghost {
        box-sizing: border-box; height: 100%; padding: 8px 12px;
        display: flex; flex-direction: column; justify-content: center; gap: 2px;
        background: rgba(12, 18, 28, 0.94);
        border: 1px solid var(--ghost-tint, #4aa3ff); border-left-width: 4px; border-radius: 8px;
      }
      #ghost-name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #ghost-mode { font-size: 11px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #ghost[data-mode="cancel"] { opacity: 0.55; }
    </style>
  </head>
  <body>
    <div id="ghost" data-mode="new">
      <div id="ghost-name"></div>
      <div id="ghost-mode"></div>
    </div>
    <script type="module" src="/src/ghost.ts"></script>
  </body>
</html>
